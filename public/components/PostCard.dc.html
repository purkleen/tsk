<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="vendor/image-slot.js"></script>
</helmet>
<div style="background:#FFFFFF;border-radius:26px;box-shadow:0 2px 0 rgba(43,37,64,0.04),0 8px 24px rgba(43,37,64,0.06);overflow:hidden;font-family:'Nunito',system-ui;color:#2B2540">

  <sc-if value="{{ isMilestone }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;align-items:center;gap:8px;padding:11px 16px;background:{{ milestone.soft }};color:{{ milestone.color }};font-family:'Fredoka';font-weight:600;font-size:14px">
      <span>{{ milestone.domain }}</span>
    </div>
  </sc-if>

  <div style="display:flex;align-items:center;gap:11px;padding:14px 16px 10px">
    <div style="width:42px;height:42px;border-radius:50%;background:{{ p.avatarColor }};display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;overflow:hidden">{{ avatarEl }}</div>
    <div style="flex:1;min-width:0">
      <div style="display:flex;align-items:center;gap:7px">
        <span style="font-family:'Fredoka';font-weight:600;font-size:15.5px">{{ p.author }}</span>
        <span style="font-size:11px;font-weight:700;letter-spacing:0.3px;text-transform:uppercase;padding:2px 7px;border-radius:8px;background:{{ roleChipBg }};color:{{ roleChipColor }}">{{ p.role }}</span>
      </div>
      <div style="font-size:12.5px;color:#9A93A8;font-weight:600;margin-top:1px">{{ p.time }}</div>
    </div>
    <div style="display:flex;gap:3px;padding:4px">
      <span style="width:4px;height:4px;border-radius:50%;background:#C9C4D4"></span>
      <span style="width:4px;height:4px;border-radius:50%;background:#C9C4D4"></span>
      <span style="width:4px;height:4px;border-radius:50%;background:#C9C4D4"></span>
    </div>
  </div>

  <sc-if value="{{ hasText }}" hint-placeholder-val="{{ true }}">
    <div style="padding:0 16px 12px;font-size:15px;line-height:1.5;color:#3B354D;font-weight:500">{{ p.text }}</div>
  </sc-if>

  <sc-if value="{{ hasMedia }}" hint-placeholder-val="{{ false }}">
    <div style="padding:0 12px 12px">
      <image-slot id="{{ p.slotId }}" src="{{ p.mediaSrc }}" style="width:100%;height:230px;display:block" shape="rounded" radius="18" placeholder="Tap to add a photo or browse files"></image-slot>
    </div>
  </sc-if>

  <sc-if value="{{ isMilestone }}" hint-placeholder-val="{{ false }}">
    <div style="padding:0 16px 12px">
      <div style="display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:{{ milestone.soft }}">
        <span style="width:9px;height:9px;border-radius:50%;background:{{ milestone.color }};flex-shrink:0"></span>
        <span style="font-weight:700;font-size:14px;color:{{ milestone.color }}">{{ milestone.label }}</span>
      </div>
    </div>
  </sc-if>

  <div style="display:flex;align-items:center;gap:22px;padding:6px 18px 15px;border-top:1px solid #F1EEF6;margin-top:2px">
    <button onClick="{{ onLike }}" style="display:flex;align-items:center;gap:7px;background:none;border:none;padding:4px 0;cursor:pointer;font-family:'Nunito';font-weight:700;font-size:14.5px;color:{{ likeColor }}">
      <span style="font-size:18px">{{ heart }}</span>
      <span>{{ likeCount }}</span>
    </button>
    <div style="display:flex;align-items:center;gap:7px;font-weight:700;font-size:14.5px;color:#9A93A8">
      <span style="font-size:17px">💬</span>
      <span>{{ p.comments }}</span>
    </div>
    <div style="flex:1"></div>
    <span style="font-size:17px;color:#9A93A8">↗</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:380,&quot;height&quot;:420}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props.post || {};
    const liked = !!this.props.liked;
    const role = (p.role || '').toLowerCase();
    const roleMap = {
      teacher: { bg: '#E4F5EC', color: '#2A9E68' },
      you:     { bg: '#FFF0DE', color: '#D8801E' },
      parent:  { bg: '#EAF4FC', color: '#2C7DBE' },
    };
    const chip = roleMap[role] || { bg: '#F1EEF6', color: '#8A8398' };
    return {
      p,
      hasText: !!p.text,
      avatarEl: p.avatarPhoto ? React.createElement('img', { src: p.avatarPhoto, alt: '', style: { width: '100%', height: '100%', objectFit: 'cover' } }) : p.avatar,
      hasMedia: !!p.media,
      isMilestone: !!p.milestone,
      milestone: p.milestone || {},
      roleChipBg: chip.bg,
      roleChipColor: chip.color,
      liked,
      heart: liked ? '❤️' : '🤍',
      likeColor: liked ? '#E8557A' : '#9A93A8',
      likeCount: this.props.likeCount ?? p.likes ?? 0,
      onLike: () => this.props.onLike && this.props.onLike(p.id),
    };
  }
}
</script>
</body>
</html>
